goal_file: loopy_loop_goal.txt
workflow_set: inner_outer_eval
max_turns: 160
goal_check_consecutive_failures_cap: 3
team_harness_provider: "codex"
team_harness_model: "gpt-5.5"
team_harness_agents:
  - "codex"
  - "claude"
  - "gemini"
team_harness_agent_models:
  codex: "gpt-5.5"
  claude: "claude-opus-4-8"
  gemini: "gemini-3.5-flash"
team_harness_agent_reasoning_efforts:
  codex: "high"
# Optional named model tiers: declare model ids once, let harness
# coordinators pick a tier per spawned agent (rendered into the system
# prompt as guidance). With default_tier set, REMOVE the two explicit
# mappings above — the tier becomes their single source of truth.
# The default tier must define a bundle for every team_harness_agents entry.
# model_tiers:
#   strong:
#     codex: {model: "gpt-5.6-sol", effort: "xhigh"}
#     claude: {model: "claude-fable-5", effort: "max"}
#     gemini: {model: "gemini-3.5-pro"}
#   economy:
#     codex: {model: "gpt-5.6-terra", effort: "low"}
#     claude: {model: "claude-haiku-4-5"}
#     gemini: {model: "gemini-3.5-flash"}
# default_tier: "economy"
# Optional coordinator retry controls. Omit to use team-harness defaults.
# team_harness_max_retries: 8
# team_harness_retry_base_delay_s: 2.0
# team_harness_retry_max_delay_s: 60.0
team_harness_api_base: "https://openrouter.ai/api/v1"
team_harness_api_key_env: "OPENROUTER_API_KEY"
team_harness_system_prompt_extension: |
  Shared loopy-loop protocol:
  - Read the per-attempt assignment first. Its role, layer identity, scoped
    goal, ownership, and absolute paths are authoritative.
  - Engine state and session topology are coordinator-owned. Workflow roles
    own only the semantic artifacts named by their assignment and contract.
  - Directly spawned agents are temporary delegates inside the current
    attempt. Give each a focused role/task/evidence contract; the harness
    coordinator remains accountable for integration and loop-layer decisions.
  - A genuinely terminal blocker is the only human escape hatch. After all
    autonomous routes are exhausted, atomically publish control v2 with state
    stopped, stop_reason unresolvable_error, a unique control_id, the exact
    session/workflow/attempt producer, non-empty attempted_routes, evidence_refs,
    a specific reason, and an RFC3339 created_at. Ordinary uncertainty or
    repairable failure must remain work, not a stop.
