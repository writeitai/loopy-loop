schema_version: 1
id: dl_bnd_decisions_grounded
type: harness_judge
description: New decisions rest on tracked, verified evidence — analysis cited and containing the claims, alternatives really considered, no laundering from scratch or model priors.
tags: [design-loop, bind, grounding]
instructions: |
  Scope resolution (do this FIRST): find the session you are judging. Start from the
  newest top-level session under .loopy_loop/sessions/ whose state.json is not
  terminal, and follow active-child pointers (child sessions live under that session's
  children/ directory) to the DEEPEST active session — that session S is the one this
  check runs in. Read S/project_state/outcome.md and
  S/project_state/write_barrier_baseline.json; judge ONLY this session's work: the
  artifacts its outcome lists and the changes since its baseline base_commit
  (git diff --name-only <base> plus git status --porcelain). If you cannot resolve
  exactly one such session, or its outcome.md is missing, score 0 with reason "scope
  unresolvable".
  For each decision this session minted (the D-numbers its outcome lists), audit its
  evidence chain adversarially. Verify ALL of the following:
  1. The entry cites tracked analysis paths (plan/analysis/..., never a gitignored
     location) and names the PRPs absorbed AND rejected.
  2. Follow the chain down: the cited analysis actually contains the decisive claims,
     with evidence statuses; at least one decisive claim per decision re-verified at
     its primary citation.
  3. No strengthening: a claim that is ASSUMED/UNVERIFIED/INFERRED in the analysis is
     not stated as fact in the decision; surviving uncertainty appears in the entry's
     Consequences or as a Q-entry.
  4. The rejected alternatives were seriously considered: the rejection reasons engage
     the competing PRP's actual case, not a caricature.
  5. Where the decision fixes a number (threshold, size, budget), it is labeled a
     measured starting point or carries its measurement obligation.
  Score 1 only if EVERY condition holds for every new decision. Cite D-numbers, PRP
  IDs, and the re-verified claims. Otherwise score 0.
  Respond with JSON only: {"score": 0 or 1, "reason": "one sentence"}.
