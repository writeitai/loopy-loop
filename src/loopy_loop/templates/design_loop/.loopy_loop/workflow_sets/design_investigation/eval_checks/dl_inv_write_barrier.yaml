schema_version: 1
id: dl_inv_write_barrier
type: deterministic
description: Every path this session changed is inside the investigation set's allowed scope (allowlist, fail-closed detection per loopy-loop D8 — revert violations, then re-run).
tags: [design-loop, investigation, write-barrier]
script: |
  import hashlib, json, subprocess, sys
  from pathlib import Path

  ALLOWED_FILES = {"questions.md"}
  ALLOWED_PREFIXES = (
      "plan/analysis/",
      "plan/proposals/",
      "_additional_context/",
      ".loopy_loop/",
      ".eval-banana/",
  )
  DENIED_PREFIXES = (
      "plan/analysis/phase_reviews/",
  )
  EMPTY_TREE = "4b825dc642cb6eb9a060e54bf8d69288fbee4904"

  ctx = json.loads(Path(sys.argv[1]).read_text())
  root = Path(ctx["project_root"])
  import os
  _sd = os.environ.get("LOOPY_SESSION_DIR")
  if not _sd:
      print("LOOPY_SESSION_DIR not set — goal_check must export it before eval-banana", file=sys.stderr)
      sys.exit(1)
  session_dir = Path(_sd)
  baseline_path = session_dir / "project_state" / "write_barrier_baseline.json"
  if not baseline_path.exists():
      print(f"missing baseline: {baseline_path}", file=sys.stderr)
      sys.exit(1)
  baseline = json.loads(baseline_path.read_text())
  base = baseline.get("base_commit") or EMPTY_TREE
  dirty_at_start = baseline.get("dirty_at_start", {})
  if isinstance(dirty_at_start, list):
      dirty_at_start = {p: None for p in dirty_at_start}

  def git(*args):
      r = subprocess.run(["git", *args], cwd=root, capture_output=True, text=True)
      if r.returncode != 0:
          print(f"git {' '.join(args)} failed: {r.stderr.strip()}", file=sys.stderr)
          sys.exit(1)
      return r.stdout

  if base != EMPTY_TREE:
      ok = subprocess.run(["git", "cat-file", "-e", f"{base}^{{commit}}"], cwd=root, capture_output=True)
      if ok.returncode != 0:
          print(f"baseline commit {base} is unreachable — cannot verify the barrier", file=sys.stderr)
          sys.exit(1)

  changed = set()
  fields = git("diff", "--name-status", "-z", "--find-renames", base).split("\0")
  i = 0
  while i < len(fields):
      status = fields[i]
      if not status:
          i += 1
          continue
      if status[0] in "RC":
          for j in (i + 1, i + 2):
              if j < len(fields) and fields[j]:
                  changed.add(fields[j])
          i += 3
      else:
          if i + 1 < len(fields) and fields[i + 1]:
              changed.add(fields[i + 1])
          i += 2
  fields = git("status", "--porcelain=v1", "-z", "--untracked-files=all").split("\0")
  i = 0
  while i < len(fields):
      entry = fields[i]
      if not entry:
          i += 1
          continue
      xy, path = entry[:2], entry[3:]
      if path:
          changed.add(path)
      if xy and xy[0] in "RC":
          i += 1
          if i < len(fields) and fields[i]:
              changed.add(fields[i])
      i += 1

  def allowed(p):
      if any(p.startswith(pre) for pre in DENIED_PREFIXES):
          return False
      return p in ALLOWED_FILES or any(p.startswith(pre) for pre in ALLOWED_PREFIXES)

  def unchanged_since_baseline(p):
      h = dirty_at_start.get(p)
      if not h:
          return False
      f = root / p
      return f.is_file() and hashlib.sha256(f.read_bytes()).hexdigest() == h

  violations = sorted(
      p for p in changed if p and not allowed(p) and not unchanged_since_baseline(p)
  )
  if violations:
      print("write barrier violated (revert these, then re-run):", file=sys.stderr)
      print("\n".join(violations), file=sys.stderr)
      sys.exit(1)
