goal_file: loopy_loop_goal.txt
workflow_set: pm_planner_dispatcher
max_turns: 120
goal_check_consecutive_failures_cap: 3
team_harness_provider: "codex"
team_harness_model: "gpt-5.5"
team_harness_agents:
  - "codex"
  - "claude"
  - "gemini"
team_harness_agent_models:
  codex: "gpt-5.5"
team_harness_agent_reasoning_efforts:
  codex: "high"
# Optional semantic strength tiers. Configure concrete ids here; stock role
# prompts select by tier and enabled family without naming vendors or models.
# This extension also reaches child sessions. With default_tier set, REMOVE the
# two explicit mappings above. Every enabled family must have a bundle in the
# default tier.
# model_tiers:
#   frontier:
#     codex: {model: "<frontier model id>", effort: "<frontier effort>"}
#     claude: {model: "<frontier model id>", effort: "<frontier effort>"}
#     gemini: {model: "<frontier model id>", effort: "<frontier effort>"}
#   strong:
#     codex: {model: "<strong model id>", effort: "<strong effort>"}
#     claude: {model: "<strong model id>", effort: "<strong effort>"}
#     gemini: {model: "<strong model id>", effort: "<strong effort>"}
#   standard:
#     codex: {model: "<standard model id>", effort: "<standard effort>"}
#     claude: {model: "<standard model id>", effort: "<standard effort>"}
#     gemini: {model: "<standard model id>", effort: "<standard effort>"}
#   economy:
#     codex: {model: "<economy model id>", effort: "<economy effort>"}
#     claude: {model: "<economy model id>", effort: "<economy effort>"}
#     gemini: {model: "<economy model id>", effort: "<economy effort>"}
# default_tier: "standard"
# Optional coordinator retry controls. Omit to use team-harness defaults.
# team_harness_max_retries: 8
# team_harness_retry_base_delay_s: 2.0
# team_harness_retry_max_delay_s: 60.0
team_harness_api_base: "https://openrouter.ai/api/v1"
team_harness_api_key_env: "OPENROUTER_API_KEY"
# This extension reaches every workflow set and depth, so keep it strictly
# layer-neutral. Role-specific instructions live in the frozen assignment.
team_harness_system_prompt_extension: |
  Model tiers, strongest to lightest: frontier, strong, standard, economy. They
  are judgment defaults for choosing a delegate's capability, not quotas or
  completion gates.

  A genuinely terminal blocker is the only human escape hatch. After all
  autonomous routes are exhausted, atomically publish control v3 with state
  stopped, stop_reason unresolvable_error, a unique control_id, the exact
  session/workflow/attempt producer, non-empty attempted_routes, evidence_refs,
  a specific reason, and an RFC3339 created_at. Ordinary uncertainty or
  repairable failure must remain work, not a stop.
