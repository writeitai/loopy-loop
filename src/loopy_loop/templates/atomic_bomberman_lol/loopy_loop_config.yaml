goal_file: "loopy_loop_goal.txt"
completion_criteria:
  - "Running `make run` (or the stack's documented equivalent) serves the game locally and opens it in a browser without errors"
  - "At least two players can join the same match and interact with each other's bombs and abilities"
  - "Grid-based map with destructible soft walls, indestructible hard walls, and at least two pickup types (e.g. extra bomb, longer blast)"
  - "Bombs explode on a timer with a blast radius that is blocked by hard walls and destroys soft walls; chain explosions propagate when another bomb is caught in a blast"
  - "At least four distinct characters, each with a passive plus Q/W/E/R actives; every active has an explicit cooldown defined in code and respected at runtime"
  - "Abilities, bombs, and movement are all authoritative on the server (or, for a local-only MVP, a single source-of-truth game loop) — no client can fake state"
  - "Automated tests cover: bomb placement + blast, chain explosion, ability cooldown, and round-end win detection"
  - "README explains: how to install deps, how to run a local match, how abilities map to QWER keys, and lists every character's ability kit"
  - "A character-kit spec document (e.g. `docs/characters.md`) describes each champion's passive + QWER with damage, range, cooldown, and a one-line design intent"
stop_criteria:
  - "A workflow updates session control.json to stopped with stop_reason unresolvable_error"
  - "The chosen stack requires a paid service or secret the agent cannot provision"
  - "Multiplayer requirement is incompatible with the execution environment (e.g. no way to bind a local port)"
  - "Three consecutive goal_check outputs are invalid or unreadable (handled automatically by goal_check_consecutive_failures_cap)"
max_turns: 60
goal_check_consecutive_failures_cap: 3
team_harness_provider: "codex"
team_harness_model: "gpt-5.5"
team_harness_agents:
  - "codex"
  - "claude"
  - "gemini"
team_harness_agent_models:
  codex: "gpt-5.5"
team_harness_agent_reasoning_efforts: {}
team_harness_api_base: "https://openrouter.ai/api/v1"
team_harness_api_key_env: "OPENROUTER_API_KEY"
team_harness_system_prompt_extension: |
  You are contributing to an open-source game project: a multiplayer
  browser-playable Atomic-Bomberman-inspired game with
  League-of-Legends-style QWER character abilities.

  Preferences:
  - Prefer the simplest viable tech stack that can plausibly ship an MVP.
    Vanilla JS + HTML5 Canvas is the default; pull in a small framework only
    if it demonstrably removes more complexity than it adds.
  - Keep commits small and focused; each iteration should leave the repo in a
    working state. No big-bang refactors.
  - Design around a single authoritative game loop on the server (or a single
    game-state module if the MVP is local-only). Do not duplicate state
    between client and server.
  - When in doubt about scope, favor "playable demo" over "feature complete".
  - Record non-obvious design decisions in `docs/` alongside the code that
    embodies them. Treat `PLAN.md` as the living worklist, not a design doc.
