[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loopy-loop"
version = "0.7.0"
description = "Run long-running AI agent workflows inside your repository."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "WriteIt.ai s.r.o.", email = "info@writeit.ai" },
]
keywords = [
    "ai",
    "agents",
    "automation",
    "loop",
    "workflow",
    "fastapi",
    "team-harness",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "eval-banana>=0.3.2",
    "fastapi>=0.115.0",
    "filelock>=3.16",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pyyaml>=6.0.2",
    "rich>=14.0",
    "team-harness>=0.5.0",
    "uvicorn[standard]>=0.32.0",
]

[project.urls]
Homepage = "https://github.com/writeitai/loopy-loop"
Repository = "https://github.com/writeitai/loopy-loop"
Issues = "https://github.com/writeitai/loopy-loop/issues"
Changelog = "https://github.com/writeitai/loopy-loop/releases"

[project.scripts]
loopy = "loopy_loop.cli:main"
loopy-loop = "loopy_loop.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pyright>=1.1",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/loopy_loop"]

[tool.ruff]
src = ["src"]
target-version = "py312"
line-length = 88
exclude = ["tmp/"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
extend-select = ["I", "B", "A", "ERA"]

[tool.ruff.lint.isort]
case-sensitive = false
force-single-line = true
force-sort-within-sections = true
known-first-party = ["loopy_loop"]
order-by-type = false
relative-imports-order = "closest-to-furthest"
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
extraPaths = ["src"]
reportArgumentType = true
reportMissingParameterType = true
reportCallIssue = true
reportMissingImports = true
reportUnusedImport = true
reportDuplicateImport = true
reportAttributeAccessIssue = true
reportUnnecessaryIsInstance = true
reportUnnecessaryComparison = true
useLibraryCodeForTypes = true
reportGeneralTypeIssues = false
reportOptionalMemberAccess = false
reportOptionalOperand = false
reportOptionalSubscript = false
reportOptionalCall = false
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownLambdaType = false
reportIncompatibleMethodOverride = false
reportIncompatibleVariableOverride = false
reportOperatorIssue = false
reportIndexIssue = false
reportReturnType = false
reportAssignmentType = false
reportPrivateUsage = false
reportTypeCommentUsage = false
reportMatchNotExhaustive = false
include = ["src"]
exclude = ["**/virtualenvs", "tmp/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["src/tests"]
